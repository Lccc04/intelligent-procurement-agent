<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>智能采购助手</title>
    <link rel="stylesheet" href="https://unpkg.com/element-plus/dist/index.css">
    <style>
        :root { font-family: Inter, "Microsoft YaHei", sans-serif; color: #1f2933; background: #f4f6f8; }
        * { box-sizing: border-box; }
        body { margin: 0; min-width: 320px; }
        button, textarea { font: inherit; }
        #app { min-height: 100vh; }
        .shell { min-height: 100vh; display: grid; grid-template-rows: 58px 1fr; }
        .topbar { display: flex; align-items: center; justify-content: space-between; padding: 0 22px; color: #fff; background: #1f4d5c; }
        .brand { display: flex; align-items: center; gap: 10px; font-weight: 700; letter-spacing: 0; }
        .brand-mark { width: 28px; height: 28px; display: grid; place-items: center; border-radius: 7px; background: #e0a458; color: #1f4d5c; font-size: 15px; }
        .top-meta { display: flex; align-items: center; gap: 12px; font-size: 12px; color: #d8e7eb; }
        .status-dot { width: 8px; height: 8px; border-radius: 50%; background: #7bd88f; }
        .layout { min-height: 0; display: grid; grid-template-columns: 238px minmax(0, 1fr) 330px; }
        .sidebar, .inspector { min-height: 0; background: #fff; }
        .sidebar { border-right: 1px solid #e2e8ec; padding: 16px 12px; }
        .inspector { border-left: 1px solid #e2e8ec; overflow: auto; padding: 16px; }
        .sidebar-head, .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
        .sidebar-head { margin: 0 8px 14px; }
        .sidebar-title, .panel-title { margin: 0; font-size: 14px; font-weight: 700; }
        .session-list { display: grid; gap: 4px; overflow: auto; max-height: calc(100vh - 118px); }
        .session { cursor: pointer; border: 0; border-left: 3px solid transparent; border-radius: 4px; padding: 10px 9px; text-align: left; background: transparent; color: #425466; }
        .session:hover, .session.active { background: #edf5f6; border-left-color: #2d7b82; color: #173e49; }
        .session-title { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; }
        .session-time { display: block; margin-top: 5px; color: #8b99a5; font-size: 11px; }
        .chat { min-width: 0; min-height: 0; display: grid; grid-template-rows: auto 1fr auto; background: #f8fafb; }
        .chat-head { display: flex; align-items: center; justify-content: space-between; padding: 16px 22px; border-bottom: 1px solid #e2e8ec; background: #fff; }
        .chat-head h1 { margin: 0; font-size: 17px; }
        .chat-head p { margin: 4px 0 0; color: #7a8791; font-size: 12px; }
        .messages { overflow: auto; padding: 22px max(22px, calc((100% - 900px) / 2)); }
        .message { display: flex; margin: 0 0 18px; }
        .message.user { justify-content: flex-end; }
        .bubble { max-width: min(780px, 88%); padding: 12px 14px; border-radius: 8px; line-height: 1.65; font-size: 14px; overflow-wrap: anywhere; }
        .message.assistant .bubble { background: #fff; border: 1px solid #e1e8eb; }
        .message.user .bubble { color: #fff; background: #2d7b82; }
        .bubble :first-child { margin-top: 0; }
        .bubble :last-child { margin-bottom: 0; }
        .bubble table { width: 100%; border-collapse: collapse; margin: 10px 0; font-size: 12px; }
        .bubble th, .bubble td { border: 1px solid #dfe6e9; padding: 5px 7px; text-align: left; }
        .bubble code { padding: 2px 4px; color: #7a421d; background: #fff4e6; border-radius: 3px; }
        .tool-line { margin: 8px 0 14px; color: #6b7b85; font-size: 12px; }
        .interrupt { margin: 8px 0 16px; padding: 14px; border-left: 4px solid #e0a458; background: #fffaf1; }
        .interrupt h3 { margin: 0 0 8px; font-size: 14px; }
        .interrupt pre { max-height: 180px; overflow: auto; padding: 9px; background: #fff; font-size: 11px; }
        .interrupt-actions { display: flex; gap: 8px; margin-top: 12px; }
        .input-dock { padding: 12px 22px 18px; border-top: 1px solid #e2e8ec; background: #fff; }
        .quick-row { display: flex; gap: 7px; overflow-x: auto; margin-bottom: 10px; }
        .quick-row button { flex: 0 0 auto; padding: 6px 10px; border: 1px solid #d5e1e4; border-radius: 14px; background: #f5f9fa; color: #35616a; cursor: pointer; font-size: 12px; }
        .composer { display: flex; gap: 10px; align-items: flex-end; max-width: 1000px; margin: auto; }
        .composer textarea { flex: 1; min-height: 42px; max-height: 130px; resize: vertical; padding: 11px 12px; border: 1px solid #ccd9de; border-radius: 6px; outline: none; }
        .composer textarea:focus { border-color: #2d7b82; box-shadow: 0 0 0 2px rgba(45,123,130,.12); }
        .inspector-section { padding-bottom: 18px; margin-bottom: 18px; border-bottom: 1px solid #edf0f2; }
        .section-caption { margin: 14px 0 8px; color: #7b8992; font-size: 12px; }
        .task-item, .artifact-item, .erp-item { padding: 9px 0; border-bottom: 1px solid #edf0f2; }
        .task-item { cursor: pointer; }
        .task-item:hover { background: #f7fafb; }
        .task-name { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
        .task-stage, .artifact-item small, .erp-item small { color: #86939c; font-size: 11px; }
        .approval-metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 7px; margin-top: 10px; }
        .approval-metric { padding: 9px 8px; border: 1px solid #e6edef; border-radius: 5px; background: #f8fbfb; }
        .approval-metric strong { display: block; color: #1f4d5c; font-size: 18px; line-height: 1.1; }
        .approval-metric span { display: block; margin-top: 4px; color: #86939c; font-size: 11px; }
        .approval-note { margin-top: 9px; color: #86939c; font-size: 11px; }
        .report { max-height: 320px; overflow: auto; margin-top: 10px; padding: 10px; background: #f7f9fa; font-size: 12px; line-height: 1.6; }
        .empty { padding: 20px 0; color: #9aa6ad; text-align: center; font-size: 12px; }
        @media (max-width: 1060px) { .layout { grid-template-columns: 210px minmax(0, 1fr); } .inspector { display: none; } }
        @media (max-width: 680px) { .layout { display: block; } .sidebar { display: none; } .chat { min-height: calc(100vh - 58px); } .topbar { padding: 0 14px; } .top-meta span { display: none; } .messages { padding: 16px 12px; } .input-dock { padding: 10px 12px 14px; } .chat-head { padding: 13px 14px; } }
    </style>
</head>
<body>
<div id="app"></div>
<script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/element-plus/dist/index.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3/dist/purify.min.js"></script>
<script src="/static/app.js"></script>
</body>
</html>
